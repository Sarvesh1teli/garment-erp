server {
    listen 80;
    server_name grm-bill-sms.telisoftware.com;
    access_log /var/log/nginx/teli-garment-sms-access.log;
    error_log /var/log/nginx/teli-garment-sms-error.log;
    client_max_body_size 8k;
    location /.well-known/acme-challenge/ {
        root /var/lib/teli-garment-sms-acme;
    }
    location / {
        return 301 https://grm-bill-sms.telisoftware.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name grm-bill-sms.telisoftware.com;
    ssl_certificate /etc/letsencrypt/live/grm-bill-sms.telisoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grm-bill-sms.telisoftware.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/teli-garment-sms-access.log;
    error_log /var/log/nginx/teli-garment-sms-error.log;
    client_max_body_size 8k;
    location / {
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Use the actual remote address, not client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
